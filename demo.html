    <style id="krewos-demo-boot-css">
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #07080d;
        color: #eef1fb;
        font-family:
          "Sora",
          system-ui,
          -apple-system,
          sans-serif;
        overflow: hidden;
      }

      .wasm-boot {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        background: radial-gradient(
          circle at 50% 42%,
          rgba(255, 169, 77, 0.1),
          rgba(7, 8, 13, 0.96) 58%
        );
        transition:
          opacity 260ms ease,
          visibility 260ms ease;
      }

      .wasm-boot[data-ready="true"] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .wasm-boot__ring {
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 999px;
        border: 2px solid rgba(255, 180, 94, 0.2);
        border-top-color: #ffae52;
        box-shadow: 0 0 28px rgba(255, 169, 77, 0.25);
        animation: wasm-spin 900ms linear infinite;
      }

      @keyframes wasm-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .wasm-boot__title {
        font-size: 0.92rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #f4f6ff;
      }

      .wasm-boot__sub {
        font-family: "Iosevka Term", ui-monospace, monospace;
        font-size: 0.76rem;
        color: #98a2c3;
      }

      .wasm-sandbox-bar {
        position: fixed;
        top: 0.85rem;
        right: 1.15rem;
        z-index: 25;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.3rem 0.45rem 0.3rem 0.65rem;
        border-radius: 999px;
        background: rgba(11, 13, 22, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.11);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.42);
        font-family:
          "Sora",
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 0.72rem;
        line-height: 1;
        color: #cfd6ee;
        user-select: none;
      }

      .wasm-sandbox-bar[hidden] {
        display: none !important;
      }

      .wasm-sandbox-bar__dot {
        width: 0.44rem;
        height: 0.44rem;
        border-radius: 999px;
        background: #3fe0a0;
        box-shadow: 0 0 10px rgba(63, 224, 160, 0.8);
        flex-shrink: 0;
      }

      .wasm-sandbox-bar__label {
        font-weight: 600;
        letter-spacing: 0.01em;
        color: #eef1fb;
        white-space: nowrap;
      }

      .wasm-sandbox-bar__meta {
        font-family: "Iosevka Term", ui-monospace, monospace;
        font-size: 0.68rem;
        color: #939ec0;
        white-space: nowrap;
      }

      .wasm-sandbox-bar__sep {
        width: 1px;
        height: 0.85rem;
        background: rgba(255, 255, 255, 0.12);
        margin: 0 0.1rem;
      }

      .wasm-sandbox-bar__btn {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
        color: #e4e9fb;
        font-family: inherit;
        font-size: 0.69rem;
        font-weight: 500;
        padding: 0.26rem 0.56rem;
        border-radius: 999px;
        cursor: pointer;
        text-decoration: none;
        white-space: nowrap;
        transition:
          background 140ms ease,
          border-color 140ms ease,
          color 140ms ease;
      }

      .wasm-sandbox-bar__btn:hover {
        background: rgba(255, 174, 82, 0.15);
        border-color: rgba(255, 174, 82, 0.42);
        color: #ffffff;
      }

      .wasm-sandbox-bar__btn--accent {
        background: rgba(255, 169, 77, 0.16);
        border-color: rgba(255, 169, 77, 0.38);
        color: #ffd093;
      }

      @media (max-width: 720px) {
        .wasm-sandbox-bar {
          top: 0.55rem;
          left: 3.6rem;
          right: 0.55rem;
          justify-content: space-between;
          padding: 0.25rem 0.4rem 0.25rem 0.55rem;
        }
        .wasm-sandbox-bar__meta {
          display: none;
        }
      }
    </style>
    <style id="krewos-app-css"></style>
  </head>
  <body data-shell-progressive="enabled">
    <div class="wasm-boot" id="wasm-boot" role="status" aria-live="polite">
      <div class="wasm-boot__ring" aria-hidden="true"></div>
      <div class="wasm-boot__title">Loading KrewOS Live Demo…</div>
      <div class="wasm-boot__sub" id="wasm-boot-status">
        Initializing in-browser sandbox (krewos_web.wasm)
      </div>
    </div>

    <aside class="wasm-sandbox-bar" id="wasm-sandbox-bar" aria-label="Sandbox Simulation Mode">
      <span class="wasm-sandbox-bar__dot" aria-hidden="true"></span>
      <span class="wasm-sandbox-bar__label">Simulated Demo</span>
      <span class="wasm-sandbox-bar__sep" aria-hidden="true"></span>
      <button type="button" class="wasm-sandbox-bar__btn" id="wasm-reset-btn" title="Reset in-memory crew &amp; transcripts">
        Reset
      </button>
      <a href="https://github.com/krewos/krewos" target="_blank" rel="noopener" class="wasm-sandbox-bar__btn" id="wasm-github-link" title="Star KrewOS on GitHub">
        ★ Star on GitHub
      </a>
      <a href="index.html#quickstart" class="wasm-sandbox-bar__btn wasm-sandbox-bar__btn--accent" id="wasm-docs-link">
        ← Quickstart
      </a>
    </aside>

    <div id="krewos-cosmos-mount"></div>

    <script src="demo.js" defer></script>
  </body>
</html>
